<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paint Alkalmazás - Kaleidoszkóp Móddal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎨 Paint Alkalmazás</h1>
        </header>

        <div class="toolbar">
            <!-- Rajzolási eszközök -->
            <div class="tool-section">
                <h3>Eszközök</h3>
                <div class="tools">
                    <button class="tool-btn active" data-tool="freehand" title="Szabadkézi rajzolás">
                        ✏️ Ecset
                    </button>
                    <button class="tool-btn" data-tool="line" title="Egyenes vonal rajzolása">
                        📏 Vonal
                    </button>
                    <button class="tool-btn" data-tool="rectangle" title="Téglalap rajzolása">
                        ▭ Téglalap
                    </button>
                    <button class="tool-btn" data-tool="circle" title="Kör rajzolása">
                        ⭕ Kör
                    </button>
                    <button class="tool-btn" data-tool="triangle" title="Háromszög rajzolása">
                        △ Háromszög
                    </button>
                    <button class="tool-btn" data-tool="eyedropper" title="Színminta vevő">
                        💧 Pipetta
                    </button>
                    <button class="tool-btn" data-tool="eraser" title="Radír">
                        🧹 Radír
                    </button>
                </div>
                <div class="fill-option">
                    <label>
                        <input type="checkbox" id="fillShape">
                        <span>Kitöltés</span>
                    </label>
                </div>
            </div>

            <!-- Színválasztó -->
            <div class="tool-section">
                <h3>Színek</h3>
                <div class="color-palette">
                    <button class="color-btn active" data-color="#000000" style="background: #000000;" title="Fekete"></button>
                    <button class="color-btn" data-color="#ffffff" style="background: #ffffff;" title="Fehér"></button>
                    <button class="color-btn" data-color="#ff0000" style="background: #ff0000;" title="Piros"></button>
                    <button class="color-btn" data-color="#00ff00" style="background: #00ff00;" title="Zöld"></button>
                    <button class="color-btn" data-color="#0000ff" style="background: #0000ff;" title="Kék"></button>
                    <button class="color-btn" data-color="#ffff00" style="background: #ffff00;" title="Sárga"></button>
                    <button class="color-btn" data-color="#ff00ff" style="background: #ff00ff;" title="Lila"></button>
                    <button class="color-btn" data-color="#00ffff" style="background: #00ffff;" title="Cyan"></button>
                    <button class="color-btn" data-color="#ffa500" style="background: #ffa500;" title="Narancs"></button>
                    <button class="color-btn" data-color="#800080" style="background: #800080;" title="Bíbor"></button>
                    <button class="color-btn" data-color="#008000" style="background: #008000;" title="Sötétzöld"></button>
                    <button class="color-btn" data-color="#808080" style="background: #808080;" title="Szürke"></button>
                    <button class="color-btn" data-color="#ff6b6b" style="background: #ff6b6b;" title="Rózsaszín"></button>
                    <button class="color-btn" data-color="#4ecdc4" style="background: #4ecdc4;" title="Türkiz"></button>
                    <button class="color-btn" data-color="#ffe66d" style="background: #ffe66d;" title="Citromsárga"></button>
                    <button class="color-btn" data-color="#95e1d3" style="background: #95e1d3;" title="Mentazöld"></button>
                    <button class="color-btn" data-color="#ff8c94" style="background: #ff8c94;" title="Korall"></button>
                    <button class="color-btn" data-color="#a8dadc" style="background: #a8dadc;" title="Világoskék"></button>
                    <button class="color-btn" data-color="#c77dff" style="background: #c77dff;" title="Világos lila"></button>
                    <button class="color-btn" data-color="#7209b7" style="background: #7209b7;" title="Sötétlila"></button>
                    <button class="color-btn" data-color="#f72585" style="background: #f72585;" title="Magenta"></button>
                    <button class="color-btn" data-color="#8b4513" style="background: #8b4513;" title="Barna"></button>
                    <button class="color-btn" data-color="#2f4f4f" style="background: #2f4f4f;" title="Sötétszürke"></button>
                    <button class="color-btn" data-color="#d4a574" style="background: #d4a574;" title="Arany"></button>
                </div>
                <div class="custom-color">
                    <label for="colorPicker">Egyéni szín:</label>
                    <input type="color" id="colorPicker" value="#000000">
                </div>
            </div>

            <!-- Ecsetméret -->
            <div class="tool-section">
                <h3>Ecsetméret</h3>
                <div class="brush-size-control">
                    <input type="range" id="brushSize" min="1" max="50" value="3">
                    <input type="number" id="brushSizeInput" min="1" max="50" value="3">
                    <span>px</span>
                </div>
            </div>

            <!-- Kaleidoszkóp mód -->
            <div class="tool-section">
                <h3>Kaleidoszkóp</h3>
                <div class="kaleidoscope-toggle">
                    <label class="toggle-switch">
                        <input type="checkbox" id="kaleidoscopeMode">
                        <span class="slider"></span>
                    </label>
                    <label for="kaleidoscopeMode">Kaleidoszkóp mód</label>
                </div>
                <div class="kaleidoscope-settings">
                    <label for="symmetryCount">Tengelyek:</label>
                    <div class="number-spinner">
                        <button class="spinner-btn" id="decrementSymmetry">−</button>
                        <input type="number" id="symmetryCount" min="2" max="12" value="6">
                        <button class="spinner-btn" id="incrementSymmetry">+</button>
                    </div>
                </div>
            </div>

            <!-- Műveletek -->
            <div class="tool-section">
                <h3>Műveletek</h3>
                <div class="action-buttons">
                    <button id="undoBtn" title="Visszavonás">↶ Vissza</button>
                    <button id="redoBtn" title="Újra">↷ Újra</button>
                    <button id="clearBtn" title="Vászon törlése">🗑️ Törlés</button>
                    <button id="saveBtn" title="Rajz mentése PNG-ként">💾 Mentés</button>
                </div>
            </div>
        </div>

        <div class="canvas-container">
            <canvas id="canvas"></canvas>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
